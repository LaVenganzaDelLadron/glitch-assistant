<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>
            Glitch Assistant
            <span>AI Software Engineer</span>
        </h1>
        <div class="header-actions">
            <button class="btn btn-danger" id="new-chat-btn">
                New Chat
            </button>
        </div>
    </header>

    <div id="chat-container"></div>

    <div id="loading">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    <div id="input-area">
        <div id="input-wrapper">
            <textarea
                id="message-input"
                placeholder="Type your message here... (Enter to send, Shift+Enter for newline)"
                rows="1"
            ></textarea>
            <button id="send-btn" title="Send message">&#9654;</button>
        </div>

    <script src="/static/script.js"></script>
</body>
</html>
